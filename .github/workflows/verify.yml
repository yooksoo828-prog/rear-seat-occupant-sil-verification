name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 29119 outcome 체크리스트: CSV 검증(outcome 41개, 상태 값, '충족'의 검토자·승인 기록)과 md 일치 확인.
      # 표준 라이브러리만 사용하므로 의존성 설치 전에 실행함.
      - name: Check 29119 outcome checklist
        run: python3 docs/29119/render_checklist.py --check

      - name: Install dependencies
        run: python -m pip install numpy

      # 통계 수치, 예비시험 재현, 사전점검·본시험 재현성, 집계 재계산, 기준선 SHA-256·87항목 확인.
      # 본시험은 임시 복사본에서 실행되므로 저장소의 results_main/ 은 바뀌지 않음.
      - name: Run self-test
        working-directory: sil_main
        run: python3 selftest.py

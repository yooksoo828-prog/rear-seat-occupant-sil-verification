</g>
<g id="text_4">
<text style="font-weight: 700; font-size: 11.5px; text-anchor: middle; fill: #1f2a44" x="503.82" y="93.86">시스템이 감지하지 못함</text>
</g>
<g id="text_5">
<text style="font-weight: 700; font-size: 11.5px; fill: #1f2a44" transform="translate(23.94 182.03)">실제로</text>
<text style="font-weight: 700; font-size: 11.5px; fill: #1f2a44" transform="translate(23.94 198.12)">탑승자 있음</text>
</g>
<g id="text_6">
<text style="font-weight: 700; font-size: 11.5px; fill: #1f2a44" transform="translate(23.94 313.34)">실제로</text>

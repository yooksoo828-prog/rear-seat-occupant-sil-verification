<g id="text_2">
<text style="font-size: 10.5px; text-anchor: start; fill: #6b7280" x="18.36" y="49.00">상용 시스템과 규제 문서가 밝힌 조건 (본 프로젝트가 시험 조건을 설계할 때의 출발점)</text>
</g>
<g id="text_3">

<g id="text_1">
<text style="font-weight: 700; font-size: 15px; text-anchor: start; fill: #1f2a44" x="18.36" y="29.80">Ariane 5 시험에서 놓친 부분</text>
</g>
<g id="text_2">
<text style="font-size: 10.5px; text-anchor: start; fill: #6b7280" x="18.36" y="45.58">조사위원회가 확인한 시험 단계별 상태</text>
</g>
<g id="text_3">
<text style="font-weight: 700; font-size: 11.5px; text-anchor: start; fill: #2f7d5b" x="163.44" y="82.40">확인된 것</text>
</g>
<g id="text_4">
<text style="font-weight: 700; font-size: 11.5px; text-anchor: start; fill: #b4432f" x="403.38" y="82.40">놓친 것</text>
</g>
<g id="text_5">
<text style="font-weight: 700; font-size: 10.5px; text-anchor: middle; fill: #1f2a44" x="82.53" y="139.24">장비 단계 시험</text>
</g>
<g id="text_6">
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(164.55 131.71)">SRI 실물로 시험</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(164.55 146.11)">환경 요인은 요구 이상으로 엄격히 시험</text>
</g>
<g id="text_7">
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(404.49 131.67)">Ariane 5의 카운트다운·비행 시퀀스·궤적에서</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(404.49 146.11)">SRI가 올바르게 동작하는지 확인하는 시험은 없었음</text>
</g>
<g id="text_8">
<text style="font-weight: 700; font-size: 10.5px; fill: #1f2a44" transform="translate(42.69 213.59)">시스템 시뮬레이션</text>
<text style="font-weight: 700; font-size: 10.5px; fill: #1f2a44" transform="translate(53.09 228.68)">(폐루프, ISF)</text>
</g>
<g id="text_9">
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(164.55 213.43)">공칭·열화 궤적, 장비 고장 격리와 복구를 확인</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(164.55 228.33)">SRI는 실물 대신 소프트웨어 모듈로 모의</text>
</g>
<g id="text_10">
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(404.49 213.93)">1992년에 실물 SRI를 제외하기로 변경</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(404.49 228.37)">실물 SRI를 넣었다면 결함을 발견할 수 있었다고 평가</text>
</g>
<g id="text_11">
<text style="font-weight: 700; font-size: 10.5px; text-anchor: middle; fill: #1f2a44" x="82.53" y="303.72">설계·인증 검토</text>
</g>
<g id="text_12">
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(164.55 296.20)">모든 주요 파트너와 외부 전문가가 참여</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(164.55 310.58)">수천 건의 문제를 처리</text>
</g>
<g id="text_13">
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(404.49 296.22)">정렬 소프트웨어의 한계와 시험 범위가 부족하다는 점을</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(404.49 310.05)">인지하지 못함 (결함의 기여 요인으로 평가)</text>
</g>
<g id="text_14">
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(18.36 395.54)">위원회 권고: 실제 장비를 가능한 한 많이 쓰고 현실적인 입력 데이터를 주입한 완전한 폐루프 시스템 시험(R2),</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(18.36 409.94)">사양과 시험 요구에 궤적 데이터 포함(R10), 기존 장비의 시험 범위 검토(R11)</text>
</g>
<g id="text_15">
<text style="font-size: 9px; text-anchor: start; fill: #6b7280" x="18.36" y="435.64">자료: Ariane 501 Inquiry Board (1996), 2.3절, 3.1절 (q~s항), 4절. ISF = 기능 모의 시설</text>
</g>
</g>
</g>
</svg>
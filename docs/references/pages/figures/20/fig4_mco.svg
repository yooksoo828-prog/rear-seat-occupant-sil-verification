<g id="text_1">
<text style="font-weight: 700; font-size: 15px; text-anchor: start; fill: #1f2a44" x="18.36" y="25.73">Mars Climate Orbiter: 단위 불일치</text>
</g>
<g id="text_2">
<text style="font-size: 10.5px; text-anchor: start; fill: #6b7280" x="18.36" y="44.16">조사위원회 1단계 보고서가 직접 원인으로 본 내용</text>
</g>
<g id="text_3">
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(41.74 83.21)">소프트웨어 인터페이스 사양</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(54.32 98.37)">출력은 뉴턴초(N·s)로</text>
</g>
<g id="text_4">
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(258.51 83.23)">지상 소프트웨어 파일의 실제 출력</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(296.24 98.34)">파운드초(lbf·s)</text>
</g>
<g id="text_5">
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(521.84 75.37)">항법 소프트웨어</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(511.00 91.12)">궤적에 미치는 영향을</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(520.12 106.84)">4.45배 낮게 계산</text>
</g>
<g id="text_6">
<text style="font-size: 9.5px; text-anchor: middle; fill: #b4432f" x="216.45" y="68.50">사양과 다름</text>
</g>
<g id="text_7">
<text style="font-size: 9.8px; fill: #1f2a44" transform="translate(231.30 201.40)">검증 측면에서 보고서가 기여 원인으로 제시한 것</text>
<text style="font-size: 9.8px; fill: #1f2a44" transform="translate(119.49 216.13)">인터페이스 사양이 제대로 쓰이지 않음 · 해당 지상 소프트웨어의 종단 간 시험이 끝나지 않은 것으로 보임</text>
<text style="font-size: 9.8px; fill: #1f2a44" transform="translate(107.07 230.80)">독립 검증 수행 여부가 불분명 · 인터페이스 통제와 지상 시스템 인터페이스 검증이 불완전하거나 엄밀하지 못함</text>
</g>
<g id="text_8">
<text style="font-size: 9px; text-anchor: start; fill: #6b7280" x="18.36" y="282.15">자료: Mars Climate Orbiter Mishap Investigation Board (1999), Phase I report 발췌본</text>
</g>
</g>
</g>

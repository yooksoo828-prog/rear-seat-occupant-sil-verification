<g id="text_1">
<text style="font-weight: 700; font-size: 15px; text-anchor: start; fill: #1f2a44" x="18.36" y="31.07">Ariane 501 결함이 파괴로 이어진 과정</text>
</g>
<g id="text_2">
<text style="font-size: 10.5px; text-anchor: start; fill: #6b7280" x="18.36" y="49.53">조사위원회가 재구성한 사건 연쇄 (원인에서 결과 순서)</text>
</g>
<g id="text_3">
<text style="font-size: 10.5px; text-anchor: middle; fill: #1f2a44" x="258.3" y="94.41">Ariane 5의 초기 궤적은 Ariane 4보다 수평속도가 약 5배 빠르게 쌓임</text>
</g>
<g id="text_4">
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(172.96 154.89)">정렬 기능이 이륙 후에도 약 40초간 작동</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(150.96 170.00)">(Ariane 4 요구에서 유지됨, Ariane 5에는 불필요)</text>
</g>
<g id="text_5">
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(164.31 214.71)">수평속도 관련 내부 변수(BH)가 한계를 넘음</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(127.01 230.30)">64비트 부동소수점 → 16비트 정수 변환에서 Operand Error</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(130.81 246.25)">(위험했던 변수 7개 중 BH를 포함한 3개는 보호되지 않았음)</text>
</g>
<g id="text_6">
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(177.97 291.53)">SRI 소프트웨어 예외로 프로세서 정지</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(127.10 306.70)">대기 SRI가 먼저, 약 0.05초 뒤 작동 SRI도 같은 원인으로 정지</text>
</g>
<g id="text_7">
<text style="font-weight: 700; font-size: 10.5px; text-anchor: end; fill: #b4432f" x="76.95" y="299.47">H0 + 36.7초</text>
</g>
<g id="text_8">
<text style="font-size: 10.5px; text-anchor: middle; fill: #1f2a44" x="258.3" y="367.74">작동 SRI가 보낸 진단 정보를 주컴퓨터가 비행 데이터로 해석</text>
</g>
<g id="text_9">
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(152.87 428.22)">주컴퓨터가 부스터·주엔진 노즐에 최대 편향 명령</text>
<text style="font-size: 10.5px; fill: #1f2a44" transform="translate(221.13 443.96)">공격각 20도 초과</text>
</g>
<g id="text_10">
<text style="font-size: 10.5px; text-anchor: middle; fill: #1f2a44" x="258.3" y="503.85">공기역학적 하중으로 기체 분리·파괴, 자폭 장치 작동</text>
</g>
<g id="text_11">
<text style="font-weight: 700; font-size: 10.5px; text-anchor: end; fill: #6b7280" x="76.95" y="504.48">H0 + 39초</text>
</g>
<g id="text_12">
<text style="font-weight: 700; font-size: 11.5px; text-anchor: middle; fill: #b4432f" x="548.46" y="115.67">시험에 없던 것</text>
</g>
<g id="text_13">
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(473.13 150.42)">SRI 사양과 장비 단계 시험에</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(473.13 164.78)">Ariane 5 궤적 데이터가</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(473.13 179.22)">포함되지 않았음</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(473.13 207.98)">그래서 정렬 기능은 Ariane 5</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(473.13 222.42)">비행 조건에서 시험되지 않았고</text>
<text style="font-size: 9.6px; fill: #1f2a44" transform="translate(473.13 236.78)">설계 오류가 발견되지 않았음</text>
</g>
<g id="text_14">
<text style="font-size: 9px; text-anchor: start; fill: #6b7280" x="18.36" y="579.00">자료: Ariane 501 Inquiry Board (1996), 2.1절, 3.1절 (e~r항). SRI = 관성기준장치, H0 = 주엔진 점화 명령 시각</text>
</g>
</g>
</g>
</svg>
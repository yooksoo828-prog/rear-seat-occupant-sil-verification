<g id="text_1">
<text style="font-weight: 700; font-size: 15px; text-anchor: start; fill: #1f2a44" x="18.36" y="25.82">Nissan 승객 분류 시스템(OCS) 리콜 14V-138</text>
</g>
<g id="text_2">
<text style="font-size: 10.5px; text-anchor: start; fill: #6b7280" x="18.36" y="44.66">센서 기반 승객 판정이 특정 조건에서 오판할 수 있는 사례 (앞좌석)</text>
</g>
<g id="text_3">
<text style="font-size: 10px; fill: #1f2a44" transform="translate(65.79 96.37)">특정 조건</text>
<text style="font-size: 10px; fill: #1f2a44" transform="translate(39.43 111.36)">엔진 아이들 시 큰 진동</text>
<text style="font-size: 10px; fill: #1f2a44" transform="translate(50.87 126.38)">특이한 착석 자세</text>
</g>
<g id="text_4">
<text style="font-size: 10px; fill: #1f2a44" transform="translate(214.25 96.36)">OCS 소프트웨어가</text>
<text style="font-size: 10px; fill: #1f2a44" transform="translate(223.99 111.37)">앞좌석 성인을</text>
<text style="font-size: 10px; fill: #1f2a44" transform="translate(197.63 126.41)">빈 좌석으로 분류할 수 있음</text>
</g>
<g id="text_5">
<text style="font-size: 10px; fill: #1f2a44" transform="translate(391.39 103.86)">조수석 에어백</text>
<text style="font-size: 10px; fill: #1f2a44" transform="translate(410.92 118.86)">억제</text>
</g>
<g id="text_6">
<text style="font-size: 10px; fill: #1f2a44" transform="translate(561.43 103.87)">충돌 시</text>
<text style="font-size: 10px; fill: #1f2a44" transform="translate(531.59 118.86)">전개되지 않을 수 있음</text>
</g>
<g id="text_7">
<text style="font-size: 9.8px; fill: #1f2a44" transform="translate(221.21 209.25)">대상 약 989,701대 (2014-03-24 제조사 결함 보고서)</text>
<text style="font-size: 9.8px; fill: #1f2a44" transform="translate(56.01 223.94)">후속 조사 RQ15-001(2015-03-18 개시): 리콜 수리 등을 받은 뒤에도 문제를 제기한 불만 124건, 문서상 충돌·화재·부상·사망 보고 없음</text>
</g>
<g id="text_8">
<text style="font-size: 9px; text-anchor: start; fill: #6b7280" x="18.36" y="266.00">자료: Nissan North America (2014), NHTSA ODI (2015). 두 문서는 시험·검증의 적절성을 직접 언급하지 않음</text>
</g>
</g>
</g>
</svg>